<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conferência Fiscal | Auditoria Automatizada</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
    <style>
        :root {
            --navy-dark: #14244b;
            --navy-mid: #1e3a8a;
            --bg-page: #f1f5f9;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --ok-bg: #dcfce7;
            --ok-text: #166534;
            --warn-bg: #fef3c7;
            --warn-text: #92400e;
            --err-bg: #fee2e2;
            --err-text: #991b1b;
            --info-bg: #dbeafe;
            --info-text: #1e40af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-page); color: var(--text-main); padding-bottom: 60px; }

        .header {
            background: linear-gradient(135deg, var(--navy-dark) 0%, #0f172a 100%);
            color: #ffffff;
            padding: 26px 20px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
            margin-bottom: 28px;
        }
        .header-content {
            max-width: 1180px;
            margin: 0 auto;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }
        .header h1 { font-size: 1.6rem; font-weight: 700; color: #ffffff; margin-bottom: 3px; }
        .header p { font-size: 0.88rem; color: #cbd5e1; }
        .header-badge {
            background-color: rgba(255, 255, 255, 0.14);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .container { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

        .card {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 2px 10px rgba(15, 23, 42, 0.05);
            border: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .grid-upload {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .upload-box {
            border: 2px dashed #cbd5e1;
            border-radius: 12px;
            padding: 20px;
            background: #f8fafc;
            transition: all 0.2s;
        }
        .upload-box:hover { border-color: var(--navy-mid); background: #eff6ff; }
        .upload-box h3 { font-size: 1rem; color: var(--navy-dark); margin-bottom: 6px; }
        .upload-box p { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 12px; }
        .upload-box input[type="file"] { width: 100%; font-size: 0.85rem; }

        .modo-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            justify-content: space-between;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        .radio-group { display: flex; flex-wrap: wrap; gap: 16px; }
        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            background: #f8fafc;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .btn-primary {
            background: var(--navy-dark);
            color: #ffffff;
            border: none;
            padding: 12px 26px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-primary:hover { background: var(--navy-mid); }
        .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }

        .btn-secondary {
            background: #ffffff;
            color: var(--navy-dark);
            border: 1px solid #cbd5e1;
            padding: 9px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-secondary:hover { background: #f1f5f9; }

        /* Fila e Pareamento */
        .preview-lista {
            margin-top: 18px;
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            display: none;
        }
        .preview-header {
            background: #f8fafc;
            padding: 10px 14px;
            font-size: 0.83rem;
            font-weight: 700;
            color: var(--navy-dark);
            border-bottom: 1px solid var(--border);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }
        .preview-itens {
            max-height: 360px;
            overflow-y: auto;
        }
        .preview-row {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 14px;
            border-bottom: 1px solid #f1f5f9;
            font-size: 0.83rem;
        }
        .tag-tipo {
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid transparent;
        }
        .tag-livro { background: #dbeafe; color: #1e40af; }
        .tag-plan { background: #e0e7ff; color: #3730a3; }
        .badge-match-ok {
            background: var(--ok-bg);
            color: var(--ok-text);
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
        }
        .badge-match-info {
            background: var(--info-bg);
            color: var(--info-text);
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
        }
        .badge-match-warn {
            background: var(--warn-bg);
            color: var(--warn-text);
            padding: 2px 8px;
            border-radius: 999px;
            font-size: 0.72rem;
            font-weight: 700;
        }
        .input-empresa, .select-vinculo {
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--navy-dark);
            background: #ffffff;
        }
        .input-empresa { width: 185px; text-transform: uppercase; }
        .select-vinculo { min-width: 240px; max-width: 310px; cursor: pointer; }

        /* Progresso */
        .progress-box {
            display: none;
            margin-top: 18px;
            padding: 16px;
            background: #f8fafc;
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background: #e2e8f0;
            border-radius: 999px;
            overflow: hidden;
            margin-top: 8px;
        }
        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--navy-mid);
            transition: width 0.25s;
        }

        .erros-lote {
            display: none;
            margin-top: 14px;
            padding: 12px 16px;
            background: var(--err-bg);
            color: var(--err-text);
            border-radius: 8px;
            font-size: 0.84rem;
        }

        /* Painel de Resultados */
        #painel-resultados { display: none; }

        /* Card de Revisão de Vínculos Pós-Extração */
        .vinculos-card {
            background: #ffffff;
            border: 2px solid #cbd5e1;
            border-radius: 12px;
            margin-bottom: 20px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
        }
